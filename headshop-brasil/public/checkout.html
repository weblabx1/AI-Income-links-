<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Headshop Brasil</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">Headshop Brasil</div>
    </header>

    <main style="padding: 20px 5%; max-width: 800px; margin: 0 auto;">
        <h2 class="section-title">Finalizar Pedido</h2>

        <div style="background: #1a1a1a; padding: 25px; border-radius: 10px;">
            <h3>Dados de Entrega</h3>
            <br>
            <input type="text" id="cep" placeholder="CEP (00000-000)"
                style="padding: 12px; width: 100%; margin-bottom: 10px; background: #222; border: 1px solid #444; color: #fff;">
            <button onclick="calculateShipping()" class="btn-primary" style="width: 100%;">Calcular Frete</button>
            <p id="shipping-result" style="margin-top: 10px;"></p>

            <hr style="margin: 25px 0; border-color: #333;">

            <h3>Cupom de Desconto</h3>
            <br>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="coupon" placeholder="Código do cupom"
                    style="padding: 12px; flex: 1; background: #222; border: 1px solid #444; color: #fff;">
                <button onclick="applyCoupon()" class="btn-primary">Aplicar</button>
            </div>
            <p id="coupon-result" style="margin-top: 10px;"></p>

            <hr style="margin: 25px 0; border-color: #333;">

            <div id="checkout-summary">
                <p>Subtotal: R$ <span id="subtotal">0,00</span></p>
                <p>Frete: R$ <span id="shipping-cost">0,00</span></p>
                <p id="discount-p" style="display: none; color: var(--primary-color);">Desconto: -R$ <span
                        id="discount-value">0,00</span></p>
                <h3 style="margin-top: 10px;">Total Final: R$ <span id="final-total">0,00</span></h3>
            </div>

            <br>
            <button onclick="payWithMercadoPago()" id="pay-btn" class="btn-primary"
                style="width: 100%; display: none;">Pagar com Mercado Pago</button>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        let shippingPrice = 0;
        let discount = 0;

        function refreshSummary() {
            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const subtotalSpan = document.getElementById('subtotal');
            const shippingSpan = document.getElementById('shipping-cost');
            const discountSpan = document.getElementById('discount-value');
            const totalSpan = document.getElementById('final-total');
            const discountP = document.getElementById('discount-p');

            subtotalSpan.textContent = subtotal.toFixed(2).replace('.', ',');
            shippingSpan.textContent = shippingPrice.toFixed(2).replace('.', ',');

            if (discount > 0) {
                const discValue = subtotal * (discount / 100);
                discountSpan.textContent = discValue.toFixed(2).replace('.', ',');
                discountP.style.display = 'block';
                totalSpan.textContent = (subtotal + shippingPrice - discValue).toFixed(2).replace('.', ',');
            } else {
                discountP.style.display = 'none';
                totalSpan.textContent = (subtotal + shippingPrice).toFixed(2).replace('.', ',');
            }

            if (cart.length > 0) {
                document.getElementById('pay-btn').style.display = 'block';
            }
        }

        async function calculateShipping() {
            const cep = document.getElementById('cep').value;
            if (!cep) return alert("Digite um CEP");

            const res = await fetch(`/api/shipping-calc?cep=${cep}`);
            const data = await res.json();
            shippingPrice = data.price;
            document.getElementById('shipping-result').textContent = `Frete estimado: R$ ${data.price.toFixed(2)} - Prazo: ${data.deliveryTime} dias.`;
            refreshSummary();
        }

        function applyCoupon() {
            const code = document.getElementById('coupon').value;
            if (code.toUpperCase() === 'PCQURA') {
                discount = 15;
                document.getElementById('coupon-result').textContent = "Cupom PCQURA aplicado! 15% de desconto.";
                document.getElementById('coupon-result').style.color = "var(--primary-color)";
                localStorage.setItem('headshop_coupon', 'PCQURA');
            } else {
                discount = 0;
                document.getElementById('coupon-result').textContent = "Cupom inválido.";
                document.getElementById('coupon-result').style.color = "var(--accent-color)";
            }
            refreshSummary();
        }

        async function payWithMercadoPago() {
            const response = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    items: cart,
                    couponCode: localStorage.getItem('headshop_coupon'),
                    shippingInfo: { cep: document.getElementById('cep').value }
                })
            });
            const data = await response.json();
            alert("Redirecionando para Mercado Pago... (Simulado)");
            console.log(data);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Check if coupon was already applied (e.g. from QURA reference)
            const savedCoupon = localStorage.getItem('headshop_coupon');
            if (savedCoupon === 'PCQURA') {
                document.getElementById('coupon').value = 'PCQURA';
                applyCoupon();
            }
            refreshSummary();
        });
    </script>
</body>

</html>
