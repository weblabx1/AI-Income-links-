<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Headshop Brasil</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">Headshop Brasil</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalog.html">Produtos</a></li>
                <li><a href="cart.html">Carrinho (<span id="cart-count">0</span>)</a></li>
                <li><a href="admin.html">Painel</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Nosso Catálogo</h2>

        <div class="filters"
            style="padding: 0 5%; margin-bottom: 20px; display: flex; gap: 10px; justify-content: center;">
            <select id="category-filter" style="padding: 10px; background: #222; color: #fff; border: 1px solid #444;">
                <option value="all">Todas as Categorias</option>
                <option value="Seda">Sedas</option>
                <option value="Piteira">Piteiras</option>
                <option value="Dichavador">Dichavadores</option>
                <option value="Bong">Bongs</option>
            </select>
            <select id="sort-filter" style="padding: 10px; background: #222; color: #fff; border: 1px solid #444;">
                <option value="default">Ordenar por</option>
                <option value="price-asc">Menor Preço</option>
                <option value="price-desc">Maior Preço</option>
            </select>
        </div>

        <div class="product-grid" id="catalog-products">
            <!-- All products will load here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Headshop Brasil.</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Catalog specific logic
        async function loadCatalog() {
            const grid = document.getElementById('catalog-products');
            const res = await fetch('/api/products');
            let products = await res.json();

            const categoryFilter = document.getElementById('category-filter');
            const sortFilter = document.getElementById('sort-filter');

            function render(prods) {
                grid.innerHTML = prods.map(product => `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="${product.image}" alt="${product.name}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/250x200?text=${product.name}'">
                        </div>
                        <div class="product-info">
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-price">R$ ${product.price.toFixed(2).replace('.', ',')}</p>
                            <br>
                            <button class="btn-primary" onclick="addToCart('${product.id}')">Adicionar ao Carrinho</button>
                        </div>
                    </div>
                `).join('');
            }

            function applyFilters() {
                let filtered = [...products];
                const cat = categoryFilter.value;
                const sort = sortFilter.value;

                if (cat !== 'all') {
                    filtered = filtered.filter(p => p.category === cat);
                }

                if (sort === 'price-asc') {
                    filtered.sort((a, b) => a.price - b.price);
                } else if (sort === 'price-desc') {
                    filtered.sort((a, b) => b.price - a.price);
                }

                render(filtered);
            }

            categoryFilter.addEventListener('change', applyFilters);
            sortFilter.addEventListener('change', applyFilters);

            render(products);
        }

        document.addEventListener('DOMContentLoaded', loadCatalog);
    </script>
</body>

</html>
